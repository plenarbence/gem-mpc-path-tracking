services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: gem-mpc-path-tracking:dev
    working_dir: /workspace
    environment:
      DISPLAY: ":1"
      SCREEN_GEOMETRY: 1600x900x24
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    init: true
    command: start-gui
